[package]
name = "avid"
version = "0.1.0"
description = "Avid personal reading and listening library"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8.3"
tts = "0.26.3"
sha2 = "0.10"
aes-gcm = "0.10"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros", "rt-multi-thread"] }
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
