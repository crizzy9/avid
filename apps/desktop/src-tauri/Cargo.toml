[package]
name = "avid"
version = "0.1.0"
description = "Avid personal reading and listening library"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8.3"
tts = "0.26.3"
