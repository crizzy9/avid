name: Build native hosts
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'packages/i18n/native-messages.json'
      - '.github/workflows/native.yml'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @avid/mobile exec cap sync ios
      - run: pnpm --filter @avid/mobile verify:ios
      - name: Compile app and widget without signing
        run: >-
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/avid-ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Compile optional CarPlay source without signing
        run: >-
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App-CarPlay
          -configuration DebugCarPlay -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/avid-ios-car-build CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @avid/mobile exec cap sync android
      - run: pnpm --filter @avid/mobile build:android
      - uses: actions/upload-artifact@v4
        with:
          name: avid-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Test Android catalog and compile optional Auto host
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -PavidCarEnabled=true
      - uses: actions/upload-artifact@v4
        with:
          name: avid-android-auto-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libspeechd-dev libclang-dev libdbus-1-dev
      - run: rustup update stable --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compile linked desktop binary
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked
      - name: Test desktop storage and protocol boundaries
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Package unsigned macOS application
        if: runner.os == 'macOS'
        run: pnpm --filter @avid/desktop exec tauri build --debug --ci --no-sign --bundles app
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: pnpm --filter @avid/desktop exec tauri build --debug --ci --no-sign --bundles deb
      - name: Package unsigned Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @avid/desktop exec tauri build --debug --ci --no-sign --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: avid-desktop-${{ runner.os }}-unsigned-debug
          path: apps/desktop/src-tauri/target/debug/bundle
          retention-days: 14
